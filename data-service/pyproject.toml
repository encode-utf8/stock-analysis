[project]
name = "data-service"
version = "0.1.0"
description = "个股与基金行情数据侧车（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "akshare>=1.16",
    "pandas>=2.2",
    "curl_cffi>=0.10",
    "py-mini-racer>=0.6",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000
reload = true
app_dir = "data-service"
