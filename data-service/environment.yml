# 行情数据侧车专属 conda 环境。
# 创建命令：conda env create -n stock-analysis -f data-service/environment.yml
name: stock-analysis
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - fastapi>=0.115
      - "uvicorn[standard]>=0.30"
      - pydantic-settings>=2.6
      - akshare>=1.16
      - pandas>=2.2
      - curl_cffi>=0.10
      - py-mini-racer>=0.6
